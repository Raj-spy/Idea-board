name: Optional CI failure analysis

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  analyze-failure:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the trusted default-branch analyzer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Analyze sanitized failure diagnostics (optional)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/failure_analyzer.py
