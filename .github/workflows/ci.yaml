name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      POSTGRES_PASSWORD: ci-only-not-a-production-credential
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt

      - name: Run pytest
        run: python -m pytest backend/tests --junitxml=pytest-report.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

  compose-validation:
    name: Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          compose_env="$RUNNER_TEMP/ideaboard-compose.env"
          umask 077
          cat > "$compose_env" <<'EOF'
          POSTGRES_DB=ideaboard
          POSTGRES_USER=ideaboard
          POSTGRES_PASSWORD=ci-compose-config-only
          APP_PORT=18080
          CORS_ORIGINS=http://localhost:18080
          VITE_API_BASE_URL=
          EOF
          docker compose --env-file "$compose_env" config --quiet

  docker-build:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend-tests
      - frontend-build
      - compose-validation
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ideaboard/backend:ci-${{ github.sha }}
          cache-from: type=gha,scope=ci-backend
          cache-to: type=gha,scope=ci-backend,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ideaboard/frontend:ci-${{ github.sha }}
          cache-from: type=gha,scope=ci-frontend
          cache-to: type=gha,scope=ci-frontend,mode=max

  integration-test:
    name: Compose integration test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - backend-tests
      - frontend-build
      - compose-validation
      - docker-build
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create temporary CI database credentials
        shell: bash
        run: |
          set -euo pipefail
          compose_env="$RUNNER_TEMP/ideaboard-integration.env"
          umask 077
          {
            printf 'POSTGRES_DB=ideaboard\n'
            printf 'POSTGRES_USER=ideaboard\n'
            printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)"
            printf 'APP_PORT=18080\n'
            printf 'CORS_ORIGINS=http://localhost:18080\n'
            printf 'VITE_API_BASE_URL=\n'
          } > "$compose_env"

      - name: Start Compose services and wait for health
        run: docker compose --env-file "$RUNNER_TEMP/ideaboard-integration.env" up --build --detach --wait --wait-timeout 240

      - name: Verify frontend, health, idea creation, retrieval, and validation
        shell: bash
        run: |
          set -euo pipefail
          base_url="http://127.0.0.1:18080"
          curl --fail --silent --show-error "$base_url/" --output "$RUNNER_TEMP/frontend.html"
          grep -q '<title>IdeaBoard</title>' "$RUNNER_TEMP/frontend.html"

          curl --fail --silent --show-error "$base_url/health" |
            jq --exit-status '.status == "ok" and .database == "connected"'

          idea="CI integration check ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          payload="$(jq --null-input --arg content "$idea" '{content: $content}')"
          post_status="$(
            curl --silent --show-error \
              --output "$RUNNER_TEMP/created-idea.json" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --data "$payload" \
              "$base_url/api/ideas"
          )"
          test "$post_status" = "201"
          jq --exit-status --arg content "$idea" '.content == $content and (.id | type == "number")' \
            "$RUNNER_TEMP/created-idea.json"

          curl --fail --silent --show-error "$base_url/api/ideas" |
            jq --exit-status --arg content "$idea" 'any(.[]; .content == $content)'

          invalid_status="$(
            curl --silent --show-error \
              --output "$RUNNER_TEMP/invalid-idea.json" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"content":"   "}' \
              "$base_url/api/ideas"
          )"
          test "$invalid_status" = "422"

      - name: Collect container logs on failure
        if: failure()
        run: docker compose --env-file "$RUNNER_TEMP/ideaboard-integration.env" logs --no-color

      - name: Shut down isolated integration stack
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/ideaboard-integration.env" ]]; then
            docker compose --env-file "$RUNNER_TEMP/ideaboard-integration.env" down --volumes --remove-orphans
          fi

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install audit tool
        run: python -m pip install pip-audit==2.9.0

      - name: Audit backend requirements
        run: pip-audit --requirement backend/requirements.txt --format json --output pip-audit.json

      - name: Upload Python audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dependency-audit
          path: pip-audit.json
          if-no-files-found: ignore
          retention-days: 30

  npm-dependency-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit npm dependencies and enforce reviewed policy
        shell: bash
        run: |
          set -euo pipefail
          audit_report="$RUNNER_TEMP/npm-audit.json"
          npm_status=0
          npm audit --json > "$audit_report" || npm_status=$?
          node ../.github/scripts/check-npm-audit.mjs \
            "$audit_report" \
            package-lock.json \
            ../.github/security/known-npm-advisories.json \
            "$npm_status"

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-dependency-audit
          path: ${{ runner.temp }}/npm-audit.json
          if-no-files-found: ignore
          retention-days: 30

  dependency-review:
    name: Review dependency changes in pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: false

  secret-scan:
    name: Repository secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  container-security:
    name: Container image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend image for scanning
        id: backend-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: ideaboard/backend:security-${{ github.sha }}
          cache-from: type=gha,scope=security-backend
          cache-to: type=gha,scope=security-backend,mode=max

      - name: Build frontend image for scanning
        id: frontend-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          push: false
          tags: ideaboard/frontend:security-${{ github.sha }}
          cache-from: type=gha,scope=security-frontend
          cache-to: type=gha,scope=security-frontend,mode=max

      - name: Save images for vulnerability analysis
        id: save-images
        if: steps.backend-image.outcome == 'success' && steps.frontend-image.outcome == 'success'
        run: |
          docker image save --output trivy-backend.tar "ideaboard/backend:security-${GITHUB_SHA}"
          docker image save --output trivy-frontend.tar "ideaboard/frontend:security-${GITHUB_SHA}"

      - name: Prepare Trivy cache
        if: always()
        run: mkdir -p "$RUNNER_TEMP/trivy-cache"

      - name: Scan backend image (JSON gate)
        id: backend-scan
        if: always() && steps.save-images.outcome == 'success'
        continue-on-error: true
        run: |
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --mount "type=bind,source=$RUNNER_TEMP/trivy-cache,target=/root/.cache" \
            aquasec/trivy@sha256:1c78ed1ef824ab8bb05b04359d186e4c1229d0b3e67005faacb54a7d71974f73 \
            image --input /workspace/trivy-backend.tar \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json --output /workspace/trivy-backend.json \
            --exit-code 1

      - name: Scan frontend image (JSON gate)
        id: frontend-scan
        if: always() && steps.save-images.outcome == 'success'
        continue-on-error: true
        run: |
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --mount "type=bind,source=$RUNNER_TEMP/trivy-cache,target=/root/.cache" \
            aquasec/trivy@sha256:1c78ed1ef824ab8bb05b04359d186e4c1229d0b3e67005faacb54a7d71974f73 \
            image --input /workspace/trivy-frontend.tar \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json --output /workspace/trivy-frontend.json \
            --exit-code 1

      - name: Generate backend SARIF report
        id: backend-sarif
        if: always() && steps.save-images.outcome == 'success'
        continue-on-error: true
        run: |
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --mount "type=bind,source=$RUNNER_TEMP/trivy-cache,target=/root/.cache" \
            aquasec/trivy@sha256:1c78ed1ef824ab8bb05b04359d186e4c1229d0b3e67005faacb54a7d71974f73 \
            image --input /workspace/trivy-backend.tar \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format sarif --output /workspace/trivy-backend.sarif \
            --exit-code 0

      - name: Generate frontend SARIF report
        id: frontend-sarif
        if: always() && steps.save-images.outcome == 'success'
        continue-on-error: true
        run: |
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --mount "type=bind,source=$RUNNER_TEMP/trivy-cache,target=/root/.cache" \
            aquasec/trivy@sha256:1c78ed1ef824ab8bb05b04359d186e4c1229d0b3e67005faacb54a7d71974f73 \
            image --input /workspace/trivy-frontend.tar \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format sarif --output /workspace/trivy-frontend.sarif \
            --exit-code 0

      - name: Upload backend findings to GitHub Security
        if: always() && steps.backend-sarif.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload frontend findings to GitHub Security
        if: always() && steps.frontend-sarif.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Upload Trivy SARIF reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-vulnerability-reports
          path: |
            trivy-backend.json
            trivy-backend.sarif
            trivy-frontend.json
            trivy-frontend.sarif
          if-no-files-found: ignore
          retention-days: 30

      - name: Enforce image vulnerability gates
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.backend-image.outcome }}" != "success" ||
                "${{ steps.frontend-image.outcome }}" != "success" ||
                "${{ steps.save-images.outcome }}" != "success" ||
                "${{ steps.backend-scan.outcome }}" != "success" ||
                "${{ steps.frontend-scan.outcome }}" != "success" ]]; then
            echo "Image build, scan, or vulnerability gate failed. Review the separate JSON and SARIF artifacts."
            exit 1
          fi
